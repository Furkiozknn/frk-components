<div id="root" data-composition-id="kure-reklam" data-start="0" data-duration="30" data-width="1080" data-height="1920">

<div id="orb"></div>
<div id="alt"></div>
<div id="kapanis"></div>
</div>
<script src="status-orb.js"></script>
<script src="konusma/reklam-tr.speech.js"></script>
<script src="konusma/reklam-en.speech.js"></script>
<script>
(function () {
  var hf = window.__hyperframes, V = (hf && hf.getVariables && hf.getVariables()) || {};
  var L = V.locale === 'en' ? 'en' : 'tr';
  var T = { tr: { alt: 'Sesin kareyi çizer.', son: 'Tek dosya · kütüphane yok · kare kare aynı' }, en: { alt: 'Your voice draws the frame.', son: 'One file · no library · same frame every time' } }[L];
  document.getElementById('alt').textContent = T.alt;
  document.getElementById('kapanis').textContent = T.son;
  var sp = window.SEZGI_SES['reklam-' + L], len = sp.zarf.length / sp.fps, AT = 2.0;
  var inst = FRKComponents.statusOrb.mount(document.getElementById('orb'), { seed: 1, locale: L, label: true, duration: 30, speech: sp,
    states: [[0, 'listening'], [AT, 'speaking'], [AT + len + 0.3, 'approval']] });
  window.__timelines = window.__timelines || {};
  if (window.gsap) {
    var P = { t: 0 };
    window.__timelines['kure-reklam'] = gsap.timeline({ paused: true })
      .fromTo(P, { t: 0 }, { t: 30, duration: 30, ease: 'none', onUpdate: function () { inst.seek(P.t); } }, 0)
      .fromTo('#baslik', { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.6, ease: 'power3.out' }, 0.1)
      .fromTo('#alt', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0.8)
      .to('#alt', { opacity: 0, duration: 0.4 }, 1.9)
      .fromTo('#kapanis', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, 26.2);
  }
})();
</script>

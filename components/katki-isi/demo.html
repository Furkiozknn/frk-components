<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katkı ısısı — frk-components</title>
<style>
@font-face{font-family:"League Gothic";src:url(../../assets/fonts/league-gothic-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"League Gothic";src:url(../../assets/fonts/league-gothic-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"JetBrains Mono";src:url(../../assets/fonts/jetbrains-mono-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"JetBrains Mono";src:url(../../assets/fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--bg:#0e0d0b;--panel:#1a1712;--cream:#f1ece2;--mute:#b9b4a8;--yellow:#ffc21a;--line:#3a352b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.5 "JetBrains Mono",ui-monospace,monospace;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:24px 16px 40px}
h1{font:400 clamp(44px,12vw,72px)/1 "League Gothic",Impact,sans-serif;letter-spacing:.02em;margin:0;text-transform:uppercase}
h1 span{color:var(--yellow)}
.tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
p.lead{margin:8px 0 20px;color:var(--mute);font-size:14px}
#stage{width:100%;aspect-ratio:1/1;max-width:560px;margin:0 auto;display:block;background:var(--bg);border:1px solid var(--line);container-type:size}
.frk-demo{max-width:560px;margin:16px auto 0;display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select,input[type=number]{font:inherit;font-size:14px;color:var(--cream);background:var(--panel);border:1px solid var(--line);padding:10px 14px;min-height:44px;cursor:pointer}
button.main{background:var(--yellow);color:#0e0d0b;border-color:var(--yellow);font-weight:700}
input[type=number]{width:9em;cursor:text}
input[type=range]{flex:1;min-width:140px;accent-color:var(--yellow);height:44px}
label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.hint{font-size:12px;color:var(--mute)}
kbd{border:1px solid var(--line);padding:0 6px;font:inherit}
</style>
</head>
<body>
<main>
  <p class="tag" id="tag">// frk-components · parça 5</p>
  <h1>Katkı <span>ısısı</span></h1>
  <p class="lead" id="lead"></p>

  <div id="stage"></div>

  <div class="frk-demo">
    <div class="row">
      <button id="play" class="main" type="button"></button>
      <button id="replay" type="button"></button>
      <button id="lang" type="button" aria-label="Language / Dil">TR · EN</button>
    </div>
    <div class="row">
      <label for="t" id="lblT"></label>
      <input id="t" type="range" min="0" max="4" step="0.01" value="0">
      <output id="tout" for="t">0.00s</output>
    </div>
    <div class="row">
      <label for="v" id="lblV"></label>
      <input id="v" type="number" min="0" max="999999999" step="1" value="1" inputmode="numeric">
    </div>
    <p class="hint" id="hint"></p>
  </div>
</main>

<script src="katki-isi.js"></script>
<script>
(function () {
  const TXT = {
    tr: { lead: 'Hücreler sol-üstten sağ-alta doğru dolar, sayaç aynı anda yükselir. Veri tohumdan üretilen ÖRNEK VERİDİR, gerçek bir katkı kaydı değildir; görüntünün üstünde de öyle yazar.',
      play: 'Oynat', pause: 'Duraklat', again: 'Tekrar', replay: 'Baştan', t: 'Zaman', v: 'Tohum',
      hint: 'Klavye: Boşluk oynat/duraklat · R baştan · ←/→ kaydırıcıyla ileri-geri.' },
    en: { lead: 'Cells fill from top-left to bottom-right while the counter climbs. The data is SAMPLE DATA generated from the seed, not a real contribution record; the picture says so too.',
      play: 'Play', pause: 'Pause', again: 'Play again', replay: 'Restart', t: 'Time', v: 'Seed',
      hint: 'Keyboard: Space play/pause · R restart · ←/→ on the slider to scrub.' }
  };
  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), play = $('play'), slider = $('t'), tout = $('tout'), val = $('v');
  let lang = 'tr', playing = false;
  window.inst = null;

  function label() {
    const T = TXT[lang];
    document.documentElement.lang = lang;
    $('lead').textContent = T.lead; $('hint').textContent = T.hint;
    $('lblT').textContent = T.t; $('lblV').textContent = T.v; $('replay').textContent = T.replay;
    play.textContent = playing ? T.pause : (+slider.value >= +slider.max ? T.again : T.play);
  }

  function build() {
    if (window.inst) window.inst.destroy();
    const inst = window.inst = FRKComponents.katkiIsi.mount(stage, { seed: Math.max(0, Math.floor(+val.value || 0)), locale: lang });
    slider.max = inst.duration;
    playing = false; label();
    inst.play(); playing = true; label();   // prefers-reduced-motion altında play() doğrudan son hali gösterir
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { playing = false; label(); }
  }

  function toggle() {
    if (playing) { window.inst.pause(); playing = false; } else { window.inst.play(); playing = true; }
    label();
  }
  function restart() { window.inst.pause(); window.inst.seek(0); window.inst.play(); playing = true; label(); }

  stage.addEventListener('frk:tick', (e) => { slider.value = e.detail.t; tout.textContent = Math.min(e.detail.t, +slider.max).toFixed(2) + 's'; });
  stage.addEventListener('frk:end', () => { playing = false; label(); });
  play.addEventListener('click', toggle);
  $('replay').addEventListener('click', restart);
  $('lang').addEventListener('click', () => { lang = lang === 'tr' ? 'en' : 'tr'; build(); });
  val.addEventListener('change', build);
  slider.addEventListener('input', () => { window.inst.pause(); playing = false; window.inst.seek(+slider.value); label(); });
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('button,input,select,textarea')) return;
    if (e.key === ' ') { e.preventDefault(); toggle(); }
    else if (e.key === 'r' || e.key === 'R') restart();
  });
  build();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Durum Küresi — frk-components</title>
<style>
@font-face{font-family:"League Gothic";src:url(../../assets/fonts/league-gothic-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"League Gothic";src:url(../../assets/fonts/league-gothic-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"JetBrains Mono";src:url(../../assets/fonts/jetbrains-mono-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"JetBrains Mono";src:url(../../assets/fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--bg:#0e0d0b;--panel:#1a1712;--cream:#f1ece2;--mute:#b9b4a8;--yellow:#ffc21a;--line:#3a352b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.5 "JetBrains Mono",ui-monospace,monospace;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:24px 16px 40px}
h1{font:400 clamp(44px,12vw,72px)/1 "League Gothic",Impact,sans-serif;letter-spacing:.02em;margin:0;text-transform:uppercase}
h1 span{color:var(--yellow)}
.tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
p.lead{margin:8px 0 20px;color:var(--mute);font-size:14px}
#stage{width:100%;aspect-ratio:1/1;max-width:480px;margin:0 auto;display:block;background:var(--bg);border:1px solid var(--line)}
#cap{text-align:center;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:10px 0 0;min-height:1.5em}
.frk-demo{max-width:480px;margin:16px auto 0;display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-size:14px;color:var(--cream);background:var(--panel);border:1px solid var(--line);padding:10px 14px;min-height:44px;cursor:pointer}
button.main{background:var(--yellow);color:#0e0d0b;border-color:var(--yellow);font-weight:700}
button[aria-pressed=true]{border-color:var(--yellow);color:var(--yellow)}
input[type=range]{flex:1;min-width:140px;accent-color:var(--yellow);height:44px}
label,legend{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
fieldset{border:0;margin:0;padding:0}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.hint{font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<main>
  <p class="tag">// frk-components · parça 4</p>
  <h1 id="h1"></h1>
  <p class="lead" id="lead"></p>

  <div id="stage"></div>
  <p id="cap" aria-hidden="true"></p>

  <div class="frk-demo">
    <fieldset class="row" id="states">
      <legend id="lgS"></legend>
      <button type="button" data-set="listening" aria-pressed="false"></button>
      <button type="button" data-set="thinking" aria-pressed="false"></button>
      <button type="button" data-set="searching" aria-pressed="false"></button>
      <button type="button" data-set="done" aria-pressed="false"></button>
    </fieldset>
    <div class="row">
      <button id="play" class="main" type="button"></button>
      <button id="replay" type="button"></button>
      <button id="lang" type="button" aria-label="Language / Dil">TR · EN</button>
    </div>
    <div class="row">
      <label for="t" id="lblT"></label>
      <input id="t" type="range" min="0" max="6" step="0.01" value="0">
      <output id="tout" for="t">0.00s</output>
    </div>
    <div class="row">
      <label for="lv" id="lblL"></label>
      <input id="lv" type="range" min="0" max="1" step="0.01" value="0.5">
    </div>
    <p class="hint" id="hint"></p>
  </div>
</main>

<script src="status-orb.js"></script>
<script>
(function () {
  const TXT = {
    tr: { h1: 'Durum <span>Küresi</span>', lead: 'Dinliyor, düşünüyor, arıyor, bitti. Parçacıklar her karede zamandan hesaplanır; seek ile herhangi bir ana gidilir. Seviye kaydırıcısı elle girdidir, ses sinyali değil. Aynı dosya canlı demo, HyperFrames sahnesi ve kopyalanabilir kod olarak çalışır.',
      st: { listening: 'Dinliyor', thinking: 'Düşünüyor', searching: 'Arıyor', done: 'Bitti' }, lgS: 'Durum',
      play: 'Oynat', pause: 'Duraklat', again: 'Tekrar', replay: 'Baştan', t: 'Zaman', l: 'Seviye',
      hint: 'Klavye: Boşluk oynat/duraklat · R baştan · 1–4 durum seç · ←/→ kaydırıcıyla ileri-geri. Bir durum seçmek kayıttaki geri kalanı siler ve seçimi kaydeder.' },
    en: { h1: 'Status <span>Orb</span>', lead: 'Listening, thinking, searching, done. Particles are computed from time on every frame, so seek reaches any moment. The level slider is manual input, not an audio signal. One file works as a live demo, a HyperFrames scene and copyable code.',
      st: { listening: 'Listening', thinking: 'Thinking', searching: 'Searching', done: 'Done' }, lgS: 'State',
      play: 'Play', pause: 'Pause', again: 'Play again', replay: 'Restart', t: 'Time', l: 'Level',
      hint: 'Keyboard: Space play/pause · R restart · 1–4 pick a state · ←/→ on the slider to scrub. Picking a state drops the rest of the record and records your choice.' }
  };
  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), play = $('play'), slider = $('t'), tout = $('tout'), lv = $('lv');
  const btns = [...document.querySelectorAll('[data-set]')];
  let lang = 'tr';
  window.inst = null;

  function label() {
    const T = TXT[lang], i = window.inst;
    document.documentElement.lang = lang;
    $('h1').innerHTML = T.h1; $('lead').textContent = T.lead; $('hint').textContent = T.hint;
    $('lgS').textContent = T.lgS; $('lblT').textContent = T.t; $('lblL').textContent = T.l; $('replay').textContent = T.replay;
    btns.forEach((b) => { b.textContent = T.st[b.dataset.set]; b.setAttribute('aria-pressed', String(!!i && i.state === b.dataset.set)); });
    $('cap').textContent = i ? T.st[i.state] : '';
    play.textContent = i && i.playing ? T.pause : (+slider.value >= +slider.max ? T.again : T.play);
  }

  function build() {
    if (window.inst) window.inst.destroy();
    const inst = window.inst = FRKComponents.statusOrb.mount(stage, { seed: 1, locale: lang, level: +lv.value });
    slider.max = inst.duration;
    inst.play();                                // prefers-reduced-motion altında sabit poz
    label();
  }

  function toggle() { if (window.inst.playing) window.inst.pause(); else window.inst.play(true); label(); }
  function restart() { window.inst.pause(); window.inst.seek(0); window.inst.play(); label(); }
  function pick(name) { window.inst.setState(name); label(); }

  stage.addEventListener('frk:tick', (e) => { slider.value = e.detail.t; tout.textContent = Math.min(e.detail.t, +slider.max).toFixed(2) + 's'; });
  stage.addEventListener('frk:state', label);
  stage.addEventListener('frk:end', label);
  play.addEventListener('click', toggle);
  $('replay').addEventListener('click', restart);
  $('lang').addEventListener('click', () => { lang = lang === 'tr' ? 'en' : 'tr'; build(); });
  btns.forEach((b) => b.addEventListener('click', () => pick(b.dataset.set)));
  slider.addEventListener('input', () => { window.inst.pause(); window.inst.seek(+slider.value); label(); });
  lv.addEventListener('input', () => window.inst.setLevel(+lv.value));
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('button,input,select,textarea')) return;
    if (e.key === ' ') { e.preventDefault(); toggle(); }
    else if (e.key === 'r' || e.key === 'R') restart();
    else if (e.key >= '1' && e.key <= '4') pick(['listening', 'thinking', 'searching', 'done'][+e.key - 1]);
  });
  build();
})();
</script>
</body>
</html>
